<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NovaAI Video Editor</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="chat-page">


<div class="chat-header">
🎬 NovaAI Video Editor
</div>



<div class="chat-messages">


<div class="ai-message">
👋 Tell me how you want to edit your video.
</div>


</div>





<div class="chat-input">


<input type="text" placeholder="Describe video editing...">


<button>
➤
</button>


</div>



</div>





<script>


const input = document.querySelector(".chat-input input");

const button = document.querySelector(".chat-input button");

const messages = document.querySelector(".chat-messages");



button.onclick = function(){


let text = input.value.trim();


if(text === "") return;



// User Request

let user = document.createElement("div");

user.className = "user-message";

user.innerText = "🎬 Edit Request: " + text;


messages.appendChild(user);



input.value = "";





// AI Response

let ai = document.createElement("div");

ai.className = "ai-message";


ai.innerText =
`🎬 NovaAI Video Editor:

Your editing request:
${text}

AI Video Editing Features:

✅ Cut and trim videos
✅ Add transitions
✅ Add subtitles
✅ Improve video quality
✅ Remove background
✅ Add effects
✅ Create short videos

✨ Video editing plan created!`;



messages.appendChild(ai);



messages.scrollTop = messages.scrollHeight;


}



</script>



</body>

</html>
