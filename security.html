<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NovaAI Security</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="chat-page">


<div class="chat-header">
🛡️ NovaAI Security Assistant
</div>



<div class="chat-messages">


<div class="ai-message">
👋 Ask about online safety, privacy and security tips.
</div>


</div>





<div class="chat-input">


<input type="text" placeholder="Ask security question...">


<button>
➤
</button>


</div>



</div>





<script>


const input = document.querySelector(".chat-input input");

const button = document.querySelector(".chat-input button");

const messages = document.querySelector(".chat-messages");



button.onclick = function(){


let text = input.value.trim();


if(text === "") return;



// User Question

let user = document.createElement("div");

user.className = "user-message";

user.innerText = "🛡️ Question: " + text;


messages.appendChild(user);



input.value = "";





// AI Response

let ai = document.createElement("div");

ai.className = "ai-message";


ai.innerText =
`🛡️ NovaAI Security:

Your question:
${text}

Security Suggestions:

✅ Use strong passwords
✅ Enable two-factor authentication
✅ Keep software updated
✅ Protect personal information
✅ Avoid suspicious links

✨ Security advice generated!`;



messages.appendChild(ai);



messages.scrollTop = messages.scrollHeight;


}



</script>



</body>

</html>
