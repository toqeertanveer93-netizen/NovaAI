<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NovaAI Audio AI</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="chat-page">


<div class="chat-header">
🎧 NovaAI Audio AI
</div>



<div class="chat-messages">


<div class="ai-message">
👋 Describe your audio task and NovaAI will help you.
</div>


</div>





<div class="chat-input">


<input type="text" placeholder="Describe audio request...">


<button>
➤
</button>


</div>



</div>





<script>


const input = document.querySelector(".chat-input input");

const button = document.querySelector(".chat-input button");

const messages = document.querySelector(".chat-messages");



button.onclick = function(){


let text = input.value.trim();


if(text === "") return;



// User Request

let user = document.createElement("div");

user.className = "user-message";

user.innerText = "🎧 Audio Request: " + text;


messages.appendChild(user);



input.value = "";





// AI Response

let ai = document.createElement("div");

ai.className = "ai-message";


ai.innerText =
`🎧 NovaAI Audio:

Your request:
${text}

AI Audio Features:

✅ Noise removal
✅ Audio enhancement
✅ Voice improvement
✅ Audio conversion
✅ Background sound editing
✅ Speech processing

✨ Audio processing idea created!`;



messages.appendChild(ai);



messages.scrollTop = messages.scrollHeight;


}



</script>



</body>

</html>
