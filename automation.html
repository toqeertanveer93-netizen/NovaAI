<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NovaAI Automation</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="chat-page">


<div class="chat-header">
⚙️ NovaAI Automation Assistant
</div>



<div class="chat-messages">


<div class="ai-message">
👋 Tell me what task you want to automate.
</div>


</div>





<div class="chat-input">


<input type="text" placeholder="Describe automation task...">


<button>
➤
</button>


</div>



</div>





<script>


const input = document.querySelector(".chat-input input");

const button = document.querySelector(".chat-input button");

const messages = document.querySelector(".chat-messages");



button.onclick = function(){


let text = input.value.trim();


if(text === "") return;



// User Request

let user = document.createElement("div");

user.className = "user-message";

user.innerText = "⚙️ Automation Task: " + text;


messages.appendChild(user);



input.value = "";





// AI Response

let ai = document.createElement("div");

ai.className = "ai-message";


ai.innerText =
`⚙️ NovaAI Automation:

Your task:
${text}

Automation Plan:

✅ Task analysis
✅ Workflow creation
✅ Time saving steps
✅ Tool suggestions
✅ Process improvement

✨ Automation idea created!`;



messages.appendChild(ai);



messages.scrollTop = messages.scrollHeight;


}



</script>



</body>

</html>
