<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NovaAI Presentation</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="chat-page">


<div class="chat-header">
📊 NovaAI Presentation Maker
</div>



<div class="chat-messages">


<div class="ai-message">
👋 Tell me your presentation topic and NovaAI will help create slides.
</div>


</div>





<div class="chat-input">


<input type="text" placeholder="Enter presentation topic...">


<button>
➤
</button>


</div>



</div>





<script>


const input=document.querySelector(".chat-input input");

const button=document.querySelector(".chat-input button");

const messages=document.querySelector(".chat-messages");



button.onclick=function(){


let text=input.value.trim();


if(text==="") return;



// User message

let user=document.createElement("div");

user.className="user-message";

user.innerText=text;


messages.appendChild(user);



input.value="";




// AI Response

let ai=document.createElement("div");

ai.className="ai-message";


ai.innerText=
`📊 NovaAI Presentation:

Your presentation topic: ${text}

Slide 1: Introduction
Slide 2: Main Points
Slide 3: Explanation
Slide 4: Examples
Slide 5: Conclusion

✨ Presentation outline created!`;



messages.appendChild(ai);



messages.scrollTop=messages.scrollHeight;


}



</script>



</body>

</html>
