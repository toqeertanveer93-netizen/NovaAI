<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NovaAI Code</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="chat-page">


<div class="chat-header">
💻 NovaAI Code Assistant
</div>



<div class="chat-messages">


<div class="ai-message">
👋 Ask me to create HTML, CSS, JavaScript or Python code.
</div>


</div>




<div class="chat-input">


<input type="text" placeholder="Write your coding request...">


<button>
➤
</button>


</div>



</div>



<script>


const input=document.querySelector(".chat-input input");

const button=document.querySelector(".chat-input button");

const messages=document.querySelector(".chat-messages");



button.onclick=function(){


let text=input.value;


if(text=="") return;



let user=document.createElement("div");

user.className="user-message";

user.innerText=text;


messages.appendChild(user);



input.value="";



let ai=document.createElement("div");

ai.className="ai-message";


ai.innerText=
"🤖 NovaAI Code: I can help you create "+text+" code.";



messages.appendChild(ai);



}



</script>



</body>

</html>
